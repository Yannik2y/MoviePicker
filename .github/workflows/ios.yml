name: iOS Build

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  build:
    # ITMS-90725: from Apr 2027, ASC requires iOS 27 SDK (Xcode 27+). Use the xcode-27 image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"
      - name: Build
        run: |
          # generic destination avoids depending on a specific simulator name/runtime
          xcodebuild \
            -scheme MoviePicker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unit Tests
        run: |
          # Prefer a concrete simulator when available; fall back to generic is not valid for test.
          DEST=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{print "platform=iOS Simulator,id="$2; exit}')
          if [ -z "$DEST" ]; then
            DEST='platform=iOS Simulator,name=iPhone 16'
          fi
          xcodebuild \
            -scheme MoviePicker \
            -destination "$DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
