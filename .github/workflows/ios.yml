name: iOS Build

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  build:
    # App Store Connect requires iOS 26 SDK (Xcode 26+); macos-26 ships Xcode 26.x
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Build
        run: |
          # generic destination avoids depending on a specific simulator name/runtime
          xcodebuild \
            -scheme MoviePicker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
