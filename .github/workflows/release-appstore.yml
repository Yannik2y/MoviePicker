name: Release to App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Submit the uploaded build for App Review"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: appstore-release
  cancel-in-progress: false

jobs:
  release:
    name: Archive, upload, submit
    runs-on: macos-14
    timeout-minutes: 90

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Unique build number per workflow run (must increase for each ASC upload)
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      CI: "true"
      # Tags always submit; workflow_dispatch uses the input toggle
      SUBMIT_FOR_REVIEW: ${{ github.event_name == 'push' && 'true' || inputs.submit_for_review }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Inject Config.swift from TMDB_API_KEY
        run: |
          set -euo pipefail
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::TMDB_API_KEY secret is not set"
            exit 1
          fi
          cp MoviePicker/Config.swift.template MoviePicker/Config.swift
          # Replace placeholder; delimiter unlikely to appear in API keys
          sed -i.bak "s|YOUR_API_KEY_HERE|${TMDB_API_KEY}|g" MoviePicker/Config.swift
          rm -f MoviePicker/Config.swift.bak
          if grep -q "YOUR_API_KEY_HERE" MoviePicker/Config.swift; then
            echo "::error::Failed to inject TMDB API key into Config.swift"
            exit 1
          fi
          echo "Config.swift generated for CI build"

      - name: Verify App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_CONTENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required secrets — see docs/APP_STORE_CI.md"
            exit 1
          fi

      - name: Install Fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Release to App Store Connect
        run: bundle exec fastlane release

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoviePicker-ipa
          path: |
            build/*.ipa
            build/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 14
