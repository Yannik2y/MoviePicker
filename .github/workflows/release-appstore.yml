name: Release to App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Submit for App Review (uncheck for TestFlight upload only)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: appstore-release
  cancel-in-progress: false

jobs:
  release:
    name: Archive, upload, submit
    # ITMS-90725: from Apr 2027, ASC requires iOS 27 SDK (Xcode 27+). Use the xcode-27 image.
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      CI: "true"
      # Tags always submit; workflow_dispatch uses the input toggle (default: TestFlight only)
      SUBMIT_FOR_REVIEW: ${{ github.event_name == 'push' && 'true' || inputs.submit_for_review }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build number
        run: |
          # GitHub Actions expressions cannot do arithmetic; offset in shell.
          # Keeps CI builds above prior TestFlight uploads (last delivery was build 11).
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 2 ))" >> "$GITHUB_ENV"
          echo "Using BUILD_NUMBER=$(( ${{ github.run_number }} + 2 ))"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # iOS 27 SDK (clears ITMS-90725 ahead of the April 2027 cutoff)
          xcode-version: "27.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Inject Config.swift from TMDB_API_KEY
        run: |
          set -euo pipefail
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::TMDB_API_KEY secret is not set"
            exit 1
          fi
          KEY_LEN=${#TMDB_API_KEY}
          if [ "$KEY_LEN" -lt 16 ]; then
            echo "::error::TMDB_API_KEY secret looks too short (len=$KEY_LEN)"
            exit 1
          fi
          cp MoviePicker/Config.swift.template MoviePicker/Config.swift
          # Precise replace of the inject token only (never touch hasValidAPIKey sentinel).
          # Old sed of YOUR_API_KEY_HERE also rewrote `key != "YOUR_API_KEY_HERE"`,
          # making hasValidAPIKey always false after a "successful" inject.
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("MoviePicker/Config.swift")
          text = path.read_text()
          key = os.environ["TMDB_API_KEY"].strip()
          token = "__TMDB_API_KEY__"
          if text.count(token) != 1:
              raise SystemExit(f"expected exactly 1 {token} in Config.swift, found {text.count(token)}")
          assign = re.search(
              rf'static var tmdbAPIKey:\s*String\s*\{{\s*"{re.escape(token)}"\s*\}}',
              text,
          )
          if not assign:
              raise SystemExit("inject assignment for tmdbAPIKey not found")
          escaped = (
              key.replace("\\", "\\\\")
                 .replace("\"", "\\\"")
                 .replace("\n", "\\n")
                 .replace("\r", "")
          )
          new_text = text[: assign.start()] + f'static var tmdbAPIKey: String {{ "{escaped}" }}' + text[assign.end() :]
          if token in new_text:
              raise SystemExit("inject token still present after replace")
          if "unsetAPIKey" not in new_text:
              raise SystemExit("missing unsetAPIKey sentinel after inject")
          if f'!= "{escaped}"' in new_text:
              raise SystemExit("hasValidAPIKey must not compare against the real API key")
          path.write_text(new_text)
          print(f"Config.swift generated for CI build (key_len={len(key)})")
          PY

      - name: Verify App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_CONTENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required secrets — see docs/APP_STORE_CI.md"
            exit 1
          fi

      - name: Install Fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Release to App Store Connect
        run: bundle exec fastlane release

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoviePicker-ipa
          path: |
            build/*.ipa
            build/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 14
